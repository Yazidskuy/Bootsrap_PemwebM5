<!DOCTYPE html>
<html>
<head>
<title>Ruang Baca</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa;">

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="#"><b>Ruang Baca</b></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigasi">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navigasi">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Beranda</a></li>
        <li class="nav-item">
          <a class="nav-link" href="#">Tentang</a>
        </li>
        <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
      </ul>
    </div>
  </div>
</nav>

<br><br>

<div class="container">
<div class="row">
    <div class="col-md-3 col-sm-1"></div>
    
    <div class="col-md-6 col-sm-10">
      <div class="card shadow-sm">
        <div class="card-body">
            
            <center>
            <h4 style="margin-top: 10px;">Masuk ke Ruang Baca</h4>
            <!-- Nah quotes-nya ditaruh di sini -->
            <p style="color: gray; margin-bottom: 20px;">
               <i><small>"Kalau engkau hanya membaca buku yang dibaca semua orang, engkau hanya bisa berpikir sama seperti semua orang."</small></i><br>
               <small>- Haruki Murakami -</small>
            </p>
            </center>

            <form>
              <div class="mb-3">
                <label>Username</label>
                <input type="text" class="form-control" placeholder="Masukkan username">
              </div>
              <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Masukkan password">
              </div>
              
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="ceklis">
                <label class="form-check-label" for="ceklis">Ingat saya</label>
              </div>

              <button type="button" class="btn btn-success" style="width: 100%;">Masuk</button>
            </form>
            
        </div>
        
        <div class="card-footer bg-white" style="text-align: center;">
            <a href="#" style="color: #198754; text-decoration: none;">Lupa password?</a>
        </div>
        
      </div>
    </div>

    <div class="col-md-3 col-sm-1"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
